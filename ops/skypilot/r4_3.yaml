# R4.3, pretraining a tabular in-context learner from scratch (notebooks/pfn_pretraining/),
# pretraining seeds 1 and 2 on a RunPod pod via SkyPilot. Seed 0 ran on the laptop CPU and is
# the one saved in the notebook.
#
# The models are small (85,538 and 486,242 parameters), so any GPU will do and the cheaper
# ones come first. TabPFN is not used and no data is read: the notebook draws its own
# synthetic tables. The pod mounts the shared network volume only to keep the pip cache and
# the per-seed reports in this lab's namespace, /runpod-volume/tabular-icl-lab/.
#
# The NGC image ships a CUDA build of torch that pip must not replace, so only the notebook
# runner is added, with the Jupyter kernel registered under the name the report script
# executes the notebook with.
#
# Launch from the repo root (see ops/README.md):
#   sky launch -c ticl-r4 ops/skypilot/r4_3.yaml --idle-minutes-to-autostop 30 --down -y --detach-run
name: ticl-r4-3
workdir: .
resources:
  cloud: runpod
  image_id: docker:nvcr.io/nvidia/pytorch:25.02-py3
  ordered:
    - accelerators: RTXA5000:1
    - accelerators: RTXA6000:1
    - accelerators: A40:1
    - accelerators: L40S:1
    - accelerators: L40:1
    - accelerators: RTX4090:1
    - accelerators: RTXA4500:1
    - accelerators: RTXA4000:1
    - accelerators: A100-80GB:1
    - accelerators: H100:1
volumes:
  /runpod-volume: AI lab extension
envs:
  SEEDS: "1 2"
setup: |
  unset PIP_CONSTRAINT 2>/dev/null || true
  export PIP_CACHE_DIR=/runpod-volume/tabular-icl-lab/pip-cache
  mkdir -p "$PIP_CACHE_DIR" /runpod-volume/tabular-icl-lab/output
  pip install nbclient nbformat ipykernel matplotlib pandas scikit-learn
  python -m ipykernel install --user --name tabicllab
run: |
  bash notebooks/pfn_pretraining/run_r4_3_pod.sh
