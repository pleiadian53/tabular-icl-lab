# Treatment-effect notebooks (notebooks/treatment_effects/), executed end to end on a RunPod GPU
# pod via SkyPilot. Each notebook fits TabPFN dozens of times (cross-fitted nuisances,
# meta-learners, cross-checks), which is minutes on a GPU and far too slow for the laptop's CPU.
#
# NOTEBOOK names the notebook to execute; MODE=report runs notebook 01's report script instead.
# Data are downloaded once into the lake on the network volume, /runpod-volume/tabular-icl-lab/data.
# The TabPFN-3.5 weights are already on the volume, in this lab's namespace, so no token is
# needed. Outputs are copied to /runpod-volume/tabular-icl-lab/output/te/<notebook stem>/; fetch
# them before the pod's autostop deletes it.
#
# The NGC image ships a CUDA build of torch that pip must not replace, so TabPFN is installed
# without its dependencies, pinned to the upstream commit the lab develops against, and its
# other dependencies are added explicitly, as in r1_7.yaml.
#
# Launch from the repo root (see ops/README.md); add --env NOTEBOOK=... or --env MODE=report:
#   sky launch -c ticl-te ops/skypilot/te.yaml --secret TABPFN_TOKEN="" \
#     --idle-minutes-to-autostop 30 --down -y --detach-run
name: ticl-te
workdir: .
resources:
  cloud: runpod
  image_id: docker:nvcr.io/nvidia/pytorch:25.02-py3
  ordered:
    - accelerators: A40:1
    - accelerators: RTXA6000:1
    - accelerators: L40S:1
    - accelerators: L40:1
    - accelerators: RTXA5000:1
    - accelerators: RTX4090:1
    - accelerators: A100-80GB:1
    - accelerators: RTX3090:1
    - accelerators: RTXA4500:1
    - accelerators: RTXA4000:1
    - accelerators: L4:1
    - accelerators: H100:1
volumes:
  /runpod-volume: AI lab extension
envs:
  NOTEBOOK: 01_effects_with_a_known_answer.ipynb   # --env NOTEBOOK=... for another notebook
  MODE: notebook   # or report: --env MODE=report runs notebook 01's report script instead
secrets:
  TABPFN_TOKEN: null
setup: |
  # The image's /etc/pip.conf adds an extra index, pypi.ngc.nvidia.com, that no longer
  # resolves (2026-11-25); pip then retries it five times for every package before using
  # pypi.org. Ignoring the image's pip configuration leaves pypi.org as the only index.
  export PIP_CONFIG_FILE=/dev/null
  unset PIP_CONSTRAINT 2>/dev/null || true
  export PIP_CACHE_DIR=/runpod-volume/tabular-icl-lab/pip-cache
  mkdir -p "$PIP_CACHE_DIR" /runpod-volume/tabular-icl-lab/output
  # Keep the image's numpy, pandas and torch: its CUDA torch is built against them. Every pip
  # call below is constrained to the installed versions.
  pip freeze | grep -iE "^(numpy|pandas|torch)==" > /tmp/keep-image.txt
  cat /tmp/keep-image.txt
  pip install --no-deps "tabpfn @ git+https://github.com/PriorLabs/TabPFN@3f2e9f9bcb20984354727a8c0075f64bc0744ea3"
  pip install -c /tmp/keep-image.txt safetensors einops "huggingface-hub>=0.23" "pydantic>=2.8" \
    "pydantic-settings>=2.10.1" joblib tqdm filelock "lightgbm>=4.4" "skrub>=0.7,<0.11" "scikit-learn>=1.6" scipy \
    typing_extensions xgboost matplotlib nbclient nbformat ipykernel
  # DoubleML 0.11 declares numpy>=2 but uses no numpy 2 API; install it without its declared
  # dependencies and add the ones it imports, under the same constraints. The notebook's smoke
  # execution runs a DoubleML fit, so an incompatibility stops the job before the full run.
  pip install --no-deps "doubleml==0.11.4"
  pip install -c /tmp/keep-image.txt statsmodels optuna plotly seaborn
  pip install --no-deps .
  python -m ipykernel install --user --name tabicllab
run: |
  bash notebooks/treatment_effects/run_te_pod.sh
