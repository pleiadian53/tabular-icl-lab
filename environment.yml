# Conda/mamba environment for tabular-icl-lab.
#
#   mamba env create -f environment.yml     # (or: conda env create -f environment.yml)
#   conda activate tabicllab
#
# TabPFN is installed editable from a local clone next to this repository
# (../TabPFN), so upstream changes are picked up with `git pull` there. To use
# the released package instead, replace the `-e ../TabPFN` line with `tabpfn`.
#
# CPU is the local default; GPU runs go to the pod.
name: tabicllab
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.14
  # torch and lightgbm come from conda-forge, not pip, so they share the env's
  # single OpenMP runtime. pip's torch wheel bundles its own libomp.dylib, and
  # two copies abort at import on macOS ("OMP: Error #15").
  - pytorch>=2.5
  - lightgbm>=4.4
  - numpy
  - scipy
  - scikit-learn
  - pandas
  - matplotlib
  - pytest
  # Notebooks: a kernel for this env and a headless runner to check them.
  # Register once with: python -m ipykernel install --user --name tabicllab
  - ipykernel
  - nbclient
  - pip
  - pip:
      - -e ../TabPFN
      - -e .
